[project]
name = "pysakoinnin-sahk-asiointi"
requires-python = ">=3.12, <3.13"
version = "4.2.3"
dependencies = [
    "django~=5.2",
    "cryptography",
    "django-anymail",
    "django-cors-headers",
    "django-csp",
    "django-environ",
    "django-helsinki-health-endpoints",
    "django-helsinki-suomifi-messages",
    "django-helusers",
    "django-logger-extra",
    "django-mailer",
    "django-ninja~=1.4.5",
    "django-resilient-logger",
    "psycopg[c]",
    "pyclamd",
    "pydantic[email]",
    "python-dateutil",
    "sentry-sdk[django]",
]

[dependency-groups]
dev = [
    "ipython",
    "pytest-cov",
    "pytest-django",
    "pytest-freezer",
    "requests-mock",
    "syrupy",
]
prod = [
    "gunicorn",
]

[tool.uv]
package = false
exclude-newer = "P3D"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # pycodestyle
    "E",
    "W",
    # isort
    "I",
    # pep8-naming
    "N",
    # flake8-bugbear without opinionated rules
    "B0",
    # flake8-pie
    "PIE",
    # flake8-print
    "T20",
]
[tool.ruff.lint.extend-per-file-ignores]
"*/migrations/*" = ["E501"]
"*/tests/*" = ["E501"]
"api/schemas.py" = ["N815"]
"api/tests/test_api.py" = ["N815"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "pysakoinnin_sahk_asiointi.test_settings"
